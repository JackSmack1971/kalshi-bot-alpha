name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction and commands.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Which tests or checks were run?
    validations:
      required: true

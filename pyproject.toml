[project]
name = "kalshi-bot"
version = "0.0.0"
description = "Deterministic, demo-only Kalshi crypto paper-trading bot with a Phase 3 portfolio and simulated-execution kernel."
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.19.2",
    "cryptography>=50.0.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "mypy>=2.3.1",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20260518",
    "hypothesis>=6.167.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
kalshi-bot = "kalshi_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
